name: Package


on:
  push:
    branches:
    - main

  pull_request: {}


permissions:
  contents: read


env:
  GOTOOLCHAIN: local


concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true


jobs:
  package:
    name: Release packages
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Set up Go and Python
      uses: tedilabs/github-actions/.github/actions/mise.setup-tools@main
      with:
        install_args: go python
        cache_key: "{{default}}-${{ hashFiles('go.mod') }}"

    - name: Resolve Go cache paths
      id: go-cache
      shell: bash
      run: |
        {
          echo "modules=$(go env GOMODCACHE)"
          echo "build=$(go env GOCACHE)"
          echo "version=$(go env GOVERSION)"
        } >> "$GITHUB_OUTPUT"

    - name: Cache Go modules and build outputs
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          ${{ steps.go-cache.outputs.modules }}
          ${{ steps.go-cache.outputs.build }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ hashFiles('go.mod', 'go.sum') }}
        restore-keys: |
          go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-

    - name: Check GoReleaser configuration
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: v2.17.0
        args: check

    - name: Build snapshot packages
      uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
      with:
        version: v2.17.0
        args: release --snapshot --clean --skip=sign,publish

    - name: Verify Registry package layout and checksums
      run: python3 scripts/verify_release.py
